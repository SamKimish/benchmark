# Keeps the card search and the deck archetype list current with new sets and new decks on Limitless.
# Runs every Monday morning (UK) and can be run by hand from the Actions tab. Commits straight to main
# only when something changed, which Vercel then deploys.
name: Refresh card data
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-cards.mjs
      - run: node scripts/build-archetypes.mjs
      - name: Commit if changed
        run: |
          git add public/cards.json src/lib/limitless-archetypes.json src/lib/parser/retreat-locks.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh card data and Limitless archetypes"
          git push
